[project]
name = "dreamcircuit"
version = "0.1.0"
description = "Dream Circuit: a retro kart racer whose tracks are dreamed live by a diffusion model, plus a diffusion world model of an EV race car you can drive in the browser, with a physics audit of the dream."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nilay Desai" }]
requires-python = ">=3.11"
keywords = ["procedural-generation", "inpainting", "world-model", "diffusion", "edm", "interpretability", "webgpu", "racing", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.4,<2.16",  # the ONNX export uses the TorchScript exporter
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://nilayd2007.github.io/dreamcircuit/"
Repository = "https://github.com/nilayd2007/dreamcircuit"

[project.optional-dependencies]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1", "onnxconverter-common>=1.14"]
viz = ["matplotlib>=3.8", "imageio>=2.34"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
dreamcircuit = "dreamcircuit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamcircuit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train a model or run many simulation steps"]
