name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU-only PyTorch keeps CI fast)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e ".[export,dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Mypy
        run: .venv/bin/mypy src
      - name: Pytest
        run: .venv/bin/python -m pytest -W ignore::UserWarning

  web:
    name: Web (types, parity tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Simulator parity (TypeScript vs Python golden trajectories)
        run: npm test
      - run: npx vite build
