<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DREAM CIRCUIT</title>
    <meta name="description" content="A retro kart racer whose circuit is dreamed live by a diffusion model as you race. Three laps, AI rivals, and a track nobody designed." />
    <meta name="theme-color" content="#0b0420" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dream Circuit" />
    <meta property="og:title" content="Dream Circuit: the kart racer an AI dreams as you drive" />
    <meta property="og:description" content="A retro kart racer whose circuit is dreamed live by a diffusion model as you race. Free in your browser: no install, no server." />
    <meta property="og:url" content="https://nilaypilaydesai.github.io/dreamcircuit/" />
    <meta property="og:image" content="https://nilaypilaydesai.github.io/dreamcircuit/media/card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:image:alt" content="DREAM CIRCUIT over a kart on Tokyo's expressway at night: play it in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0420'/%3E%3Cpath d='M6 21c3-10 17-10 20 0' stroke='%23c79bff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23ffd23f'/%3E%3C/svg%3E" />
  </head>
  <body class="game">
    <main class="frame">
      <canvas id="game" width="384" height="216" aria-label="Dream Circuit, a retro kart racing game"></canvas>
    </main>
    <div class="touch" id="touch" aria-hidden="true">
      <button class="pause" data-ev="pause" tabindex="-1">II</button>
      <div class="zone" id="stick-zone"></div>
      <div class="stick" id="stick"><div class="knob"></div></div>
      <div class="buttons">
        <button class="back" data-k="back" tabindex="-1">BACK</button>
        <button class="item" data-k="item" tabindex="-1">ITEM</button>
        <button class="hop" data-k="drift" tabindex="-1">DRIFT</button>
      </div>
    </div>
    <noscript>Dream Circuit needs JavaScript to dream its circuits.</noscript>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
