<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DREAM CIRCUIT</title>
    <meta name="description" content="A retro kart racer whose circuit is dreamed live by a diffusion model as you race. Three laps, AI rivals, and a track nobody designed." />
    <meta name="theme-color" content="#0b0420" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0420'/%3E%3Cpath d='M6 21c3-10 17-10 20 0' stroke='%23c79bff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23ffd23f'/%3E%3C/svg%3E" />
  </head>
  <body class="game">
    <main class="frame">
      <canvas id="game" width="384" height="216" aria-label="Dream Circuit, a retro kart racing game"></canvas>
    </main>
    <div class="touch" id="touch" aria-hidden="true">
      <div class="pad">
        <button data-k="left" tabindex="-1">&#9664;</button>
        <button data-k="right" tabindex="-1">&#9654;</button>
      </div>
      <div class="pad">
        <button data-k="item" tabindex="-1">ITEM</button>
        <button data-k="drift" tabindex="-1">DRIFT</button>
        <button data-k="brake" tabindex="-1">BRAKE</button>
        <button data-k="gas" tabindex="-1">GAS</button>
      </div>
    </div>
    <noscript>Dream Circuit needs JavaScript to dream its circuits.</noscript>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
